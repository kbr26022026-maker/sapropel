:is(.eo-footer__actions) {

:is(.eo-footer__ozon:hover .eo-footer__ozon-badge) {

}
:is(.eo-footer__ozon-sub) {

}
:is(.eo-footer__link) {

  color: var(--eo-text-muted);
  text-decoration: none;
  transition: color 0.2s;
}
:is(.eo-footer__link:hover) { color: var(--eo-accent-hover); }

@media (min-width: 641px) {
  :is(.eo-footer__actions) {
    align-items: flex-end;
  }
}

@media (max-width: 640px) {
  :is(.eo-footer) {
    padding: 32px 0 28px;
  }
  :is(.eo-footer__inner) {
    padding-inline: 16px;
    gap: 20px;
  }
  :is(.eo-footer__ozon) {
    align-items: center;
  }
  :is(.eo-footer__ozon-badge) {
    width: 160px;
  }
  :is(.eo-footer__copy) {

}
