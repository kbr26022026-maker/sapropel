<style>
:is(.eo-nav) {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 100;
  font-family: var(--eo-font);
  padding: 20px 0;
  transition: background 0.3s, backdrop-filter 0.3s, padding 0.3s, border-color 0.3s;
  border-bottom: 1px solid transparent;
}
:is(.eo-nav a) { text-decoration: none; }
:is(.eo-nav.eo-nav--scrolled) {
  padding: 12px 0;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom-color: var(--eo-border);
  box-shadow: 0 6px 20px rgba(69, 69, 69, 0.08);
}
:is(.eo-nav__inner) {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
:is(.eo-nav__brand) {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--eo-text);
  font-weight: 700;
  min-height: 44px;
}
:is(.eo-nav__logo) {
  background: var(--eo-accent-hover);
  color: #fff;
  padding: 8px;
  border-radius: 12px;
  display: inline-flex;
  transition: background 0.2s;
}
:is(.eo-nav__brand:hover .eo-nav__logo) { background: var(--eo-accent); }
:is(.eo-nav__title) { font-size: 18px; letter-spacing: -0.01em; }

:is(.eo-nav__links) {
  display: flex;
  align-items: center;
  gap: 28px;
}
:is(.eo-nav__links a) {
  color: var(--eo-text);
  font-size: 14px;
  font-weight: 500;
  transition: color 0.2s;
}
:is(.eo-nav__links a:hover) { color: var(--eo-accent); }
:is(.eo-nav__cta) {
  background: var(--eo-accent-hover);
  color: #fff !important;
  padding: 10px 20px;
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(0, 66, 37, 0.25);
  transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
}
:is(.eo-nav__cta:hover) {
  background: var(--eo-accent);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(0, 66, 37, 0.4);
  color: #fff !important;
}

:is(.eo-nav__burger) {
  display: none;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--eo-border);
  color: var(--eo-text);
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  min-width: 44px;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
:is(.eo-nav__burger .eo-nav__icon-close) { display: none; }
:is(.eo-nav[data-open="true"] .eo-nav__icon-open) { display: none; }
:is(.eo-nav[data-open="true"] .eo-nav__icon-close) { display: inline; }

:is(.eo-nav__mobile) {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 12px 16px 16px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--eo-border);
  max-height: calc(100vh - 84px - env(safe-area-inset-bottom, 0px));
  overflow: auto;
}
:is(.eo-nav__mobile a) {
  color: var(--eo-text);
  padding: 12px 12px;
  font-size: 16px;
  font-weight: 500;
  border-radius: 8px;
  transition: background 0.2s, color 0.2s;
  min-height: 44px;
  display: flex;
  align-items: center;
}
:is(.eo-nav__mobile a:hover) { color: var(--eo-accent-hover); background: rgba(69, 69, 69, 0.04); }
:is(.eo-nav__mobile .eo-nav__cta-mobile) {
  background: var(--eo-accent-hover);
  color: #fff !important;
  margin-top: 8px;
  justify-content: center;
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(0, 66, 37, 0.25);
}

@media (max-width: 960px) {
  :is(.eo-nav__links) { display: none; }
  :is(.eo-nav__burger) { display: inline-flex; }
  :is(.eo-nav[data-open="true"] .eo-nav__mobile) { display: flex; }
}

@media (max-width: 640px) {
  :is(.eo-nav) {
    padding: 12px 0;
  }
  :is(.eo-nav__inner) {
    gap: 12px;
  }
  :is(.eo-nav__title) {
    font-size: 15px;
  }
  :is(.eo-nav__brand) {
    min-width: 0;
  }
  :is(.eo-nav__mobile a) {
    font-size: 15px;
  }
}

body.eo-nav-lock {
  overflow: hidden;
  touch-action: none;
}
</style>

<header class="eo-nav" id="eoNav">
  <div class="eo-nav__inner eo-wrap">
    <a href="/" class="eo-nav__brand">
      <span class="eo-nav__logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.96c1.4 9.93-6.5 17.64-8.2 17.04Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
      </span>
      <span class="eo-nav__title">ЭКО ОРГАНИКА</span>
    </a>

    <nav class="eo-nav__links" aria-label="Главное меню">
      <a href="/#about">О продукте</a>
      <a href="/#features">Преимущества</a>
      <a href="/#applications">Применение</a>
      <a href="/articles/">Блог</a>
      <a href="/#resources">Статьи и документы</a>
      <a href="/#contact">Контакты</a>
      <a href="/#contact" class="eo-nav__cta">Заказать</a>
    </nav>

    <button type="button" class="eo-nav__burger" aria-label="Меню" aria-expanded="false" aria-controls="eoNavMobile">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eo-nav__icon-open"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eo-nav__icon-close"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
  </div>

  <div class="eo-nav__mobile" id="eoNavMobile" hidden>
    <a href="/#about">О продукте</a>
    <a href="/#features">Преимущества</a>
    <a href="/#applications">Применение</a>
    <a href="/articles/">Блог</a>
    <a href="/#resources">Статьи и документы</a>
    <a href="/#contact">Контакты</a>
    <a href="/#contact" class="eo-nav__cta-mobile">Заказать</a>
  </div>
</header>

<script>
(function () {
  var nav = document.getElementById('eoNav');
  if (!nav || nav.dataset.inited) return;
  nav.dataset.inited = '1';

  var burger = nav.querySelector('.eo-nav__burger');
  var mobile = nav.querySelector('.eo-nav__mobile');

  var syncState = function (open) {
    nav.setAttribute('data-open', open ? 'true' : 'false');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (mobile) mobile.hidden = !open;
    document.body.classList.toggle('eo-nav-lock', open);
  };

  var closeMenu = function () {
    syncState(false);
  };

  var toggleMenu = function () {
    syncState(nav.getAttribute('data-open') !== 'true');
  };

  syncState(nav.getAttribute('data-open') === 'true');

  var onScroll = function () {
    nav.classList.toggle('eo-nav--scrolled', window.scrollY > 20);
  };
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  burger.addEventListener('click', toggleMenu);

  mobile && mobile.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () {
      closeMenu();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && nav.getAttribute('data-open') === 'true') {
      closeMenu();
      burger.focus();
    }
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth > 960 && nav.getAttribute('data-open') === 'true') {
      closeMenu();
    }
  });
})();
</script>
