<style>
:is(.eo-videos__head) {
  text-align: center;
  max-width: 720px;
  margin: 0 auto 60px;
  padding: 0 16px;
}
:is(.eo-videos__head h2) {
  color: var(--eo-text);
  font-size: clamp(24px, 4vw, 44px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 16px;
}
:is(.eo-videos__head p) {
  color: var(--eo-text-muted);
  font-size: clamp(15px, 2vw, 18px);
  margin: 0;
}

:is(.eo-videos__grid) {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 28px;
}
:is(.eo-video) {
  grid-column: span 12;
  margin: 0;
  border-radius: var(--eo-radius-lg);
  overflow: hidden;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--eo-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 14px 40px rgba(69, 69, 69, 0.10);
}
@media (min-width: 641px) {
  :is(.eo-video) { grid-column: span 6; }
  :is(.eo-video--wide) { grid-column: span 12; }
}
@media (min-width: 960px) {
  :is(.eo-video) { grid-column: span 4; }
  :is(.eo-video--wide) { grid-column: span 8; }
}

:is(.eo-video__frame) {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #454545;
  height: 0;
  padding-bottom: 56.25%;
}
@supports (aspect-ratio: 16 / 9) {
  :is(.eo-video__frame) {
    height: auto;
    padding-bottom: 0;
  }
}
:is(.eo-video__frame iframe) {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
:is(.eo-video figcaption) {
  padding: 22px 24px;
  color: var(--eo-text);
  font-weight: 700;
  font-size: 17px;
  line-height: 1.35;
}

@media (max-width: 640px) {
  :is(.eo-videos__head) {
    margin-bottom: 32px;
    padding: 0;
  }
  :is(.eo-videos__grid) {
    gap: 16px;
  }
  :is(.eo-video),
  :is(.eo-video--wide) {
    grid-column: span 12;
  }
  :is(.eo-video figcaption) {
    padding: 14px 16px;
    font-size: 14px;
  }
}

@media (min-width: 641px) and (max-width: 960px) {
  :is(.eo-videos__grid) {
    gap: 20px;
  }
  :is(.eo-video figcaption) {
    padding: 16px 18px;
    font-size: 15px;
  }
}
</style>
